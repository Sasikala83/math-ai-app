<!DOCTYPE html>
<html>
<head>
    <title>EduMentor – Student Solver</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }
        .container {
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 100px;
            font-size: 16px;
            padding: 10px;
        }
        button {
            background: #28a745;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        pre {
            background: #f0f0f0;
            padding: 15px;
            white-space: pre-wrap;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎓 EduMentor – Student Problem Solver</h2>

    <textarea id="problem" placeholder="Enter your math problem here..."></textarea>

    <button onclick="solve()">Solve</button>

    <div id="output"></div>
</div>

<script>
async function solve() {
    const problem = document.getElementById("problem").value;
    document.getElementById("output").innerHTML = "⏳ Solving...";

    const response = await fetch("/solve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ problem })
    });

    const data = await response.json();

    document.getElementById("output").innerHTML = `
        <h3>📘 Classification</h3>
        <pre>${JSON.stringify(data.classification, null, 2)}</pre>

        <h3>✍️ Solution</h3>
        <pre>${data.solution}</pre>

        <h3>👩‍🏫 Explanation</h3>
        <pre>${data.explanation}</pre>

        <h3>✅ Verification</h3>
        <pre>${data.verification}</pre>
    `;
}
</script>

</body>
</html>
